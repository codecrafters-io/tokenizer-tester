slug: "tokenizer"
name: "Build your own Tokenizer"
short_name: "Tokenizer"
release_status: "alpha"

description_md: |-
  A tokenizer turns text into the integers a language model reads. In this challenge, you'll build a byte-pair encoding tokenizer that's capable of training a vocabulary, encoding text, and decoding token IDs.

  Along the way, you'll learn about byte-level BPE, pretokenization, and GPT-2's encoding.

short_description_md: |-
  Learn about byte-level BPE, pretokenization, and GPT-2

completion_percentage: 5

languages:
  - slug: "python"
    release_status: "alpha"
  - slug: "rust"
    release_status: "alpha"
  - slug: "go"
    release_status: "alpha"
  - slug: "cpp"
    release_status: "alpha"
  - slug: "typescript"
    release_status: "alpha"
  - slug: "java"
