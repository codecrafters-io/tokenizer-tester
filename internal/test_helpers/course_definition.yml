marketing:
  difficulty: medium
  sample_extension_idea_title: "Special tokens"
  sample_extension_idea_description: "A tokenizer that can keep reserved tokens whole."
  frequently_asked_questions:
    - question_markdown: "What exactly will I build?"
      answer_markdown: |-
        You'll build a byte-pair encoding tokenizer. By the end of the base stages, it can train a vocabulary, encode text into token IDs, and decode those IDs back into text.

        In the last stage, your program loads GPT-2's vocabulary files and produces the same token IDs as GPT-2, so GPT-2 itself could read them.

        Later extensions add:
        * Reserved tokens such as `<|endoftext|>`
        * Token counts across languages
        * A faster encoder
        * A vocabulary trained on a different language like Hindi or Spanish

        At the end, you'll have a GitHub repo to show off.
    - question_markdown: "What exactly will I learn?"
      answer_markdown: |-
        In the first 8 stages, you'll learn:
        * How text becomes UTF-8 bytes, and why those 256 values are the starting vocabulary
        * How byte-pair encoding chooses a merge, including ties and overlapping pairs
        * How encoding applies learned merges in rank order
        * How decoding turns token IDs back into text, including broken UTF-8
        * How GPT-2 splits text before merging, and how its vocabulary files name bytes

        As your code gets complex, you'll be forced to structure and refactor it, to avoid regressions and to make adding new features easier.
    - question_markdown: "Why should I build such a project?"
      answer_markdown: |-
        Every language model reads integers, not text. Building the tokenizer shows you why the same sentence can be cheap in English and expensive in Hindi, and why a space is part of the next word.

        You'll finish with a program whose token IDs match a real GPT-2 model. That is the piece you need before you can run the model yourself.
    - question_markdown: "What are the prerequisites for this challenge?"
      answer_markdown: |-
        You should be comfortable writing code in Python, Rust, Go, C++, TypeScript, or Java, and using Git. No machine learning background is required.

        Most learners pick up the Unicode details as they go.

        What matters most is curiosity and persistence. You'll develop intuition by exploring, debugging, and discovering solutions yourself.

        While we will make it extremely simple to get started, don't expect this to be a follow-along tutorial.
  testimonials: []

stages:
  - slug: "kx8"
    name: "UTF-8 bytes"
    difficulty: very_easy
    marketing_md: |-
      In this stage, you'll implement the first step of a tokenizer, a `bytes` command that converts text into UTF-8 bytes.
  - slug: "gk8"
    name: "Most frequent pair"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll implement the `top-pair` command to find the most frequent pair of token ids.
  - slug: "fk3"
    name: "Apply a merge"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll implement the `merge` command to replace a pair of ids with a new id.
  - slug: "ur9"
    name: "Train BPE"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll implement the `train` command to merge the most frequent pair, over and over.
  - slug: "kz6"
    name: "Encode"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll encode new text by applying the earliest merge that still appears.
  - slug: "vg5"
    name: "Decode"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll turn token ids back into text, including bytes that are not valid UTF-8.
  - slug: "wl7"
    name: "Pretokenize"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll split text the way GPT-2 does before any merge is applied.
  - slug: "as1"
    name: "Match GPT-2"
    difficulty: hard
    marketing_md: |-
      In this stage, you'll load GPT-2's vocabulary and produce the same token ids as tiktoken.
