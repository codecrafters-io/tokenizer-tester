marketing:
  difficulty: medium
  sample_extension_idea_title: "Special tokens"
  sample_extension_idea_description: "A tokenizer that can keep reserved tokens whole."
  frequently_asked_questions:
    - question_markdown: "What exactly will I build?"
      answer_markdown: |-
        You'll build a byte-pair encoding tokenizer. It reads a text file and learns which pairs of bytes to merge into new tokens. It encodes text into token IDs and decodes the IDs back into text.

        In the last stage, your program loads GPT-2's vocabulary files and produces the same token IDs as OpenAI's GPT-2 tokenizer, like `[15496, 995]` for `Hello world`.

        Planned extensions:
        * Reserved tokens such as `<|endoftext|>`
        * Token counts across languages
        * A faster encoder
        * A vocabulary trained on a different language like Hindi or Spanish
        * GPT-4's tokenizer, where you work out its merges from token ranks and split numbers into groups of up to 3 digits, so ` 1999` becomes ` `, `199`, and `9`

        At the end, you'll have a GitHub repo to show off.
    - question_markdown: "What exactly will I learn?"
      answer_markdown: |-
        In the first 8 stages, you'll learn:
        * How text becomes UTF-8 bytes, and why those 256 values are the starting vocabulary
        * How byte-pair encoding chooses a merge, including ties and overlapping pairs
        * How encoding applies learned merges in rank order
        * How decoding turns token IDs back into text, including broken UTF-8
        * How GPT-2 splits text before merging, and how its vocabulary files name bytes

        As your code gets complex, you'll be forced to structure and refactor it, to avoid regressions and to make adding new features easier.
    - question_markdown: "Why should I build such a project?"
      answer_markdown: |-
        Some of the strangest things language models do start in the tokenizer. GPT-2 sees `strawberry` as `st`, `raw`, and `berry`, so the letters it is asked to count are hidden inside tokens. In ` 1999 + 2026`, it sees ` 1999` as one token and `2026` as `20` and `26`.

        You'll build the tokenizer yourself and watch these splits happen. Your finished program produces the same token IDs as GPT-2, which is one piece you need to run the model yourself.
    - question_markdown: "What are the prerequisites for this challenge?"
      answer_markdown: |-
        You should be comfortable writing code in Python, Rust, Go, C++, TypeScript, or Java, and using Git. No machine learning background is required.

        Most learners pick up the Unicode details as they go.

        What matters most is curiosity and persistence. You'll develop intuition by exploring, debugging, and discovering solutions yourself.

        While we will make it extremely simple to get started, don't expect this to be a follow-along tutorial.
  testimonials: []

stages:
  - slug: "kx8"
    name: "UTF-8 bytes"
    difficulty: very_easy
    marketing_md: |-
      In this stage, you'll implement the `bytes` command to convert text into UTF-8 bytes, the raw material of every GPT-2 token.
  - slug: "gk8"
    name: "Most frequent pair"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll implement the `top-pair` command to find the pair of tokens a tokenizer should combine next.
  - slug: "fk3"
    name: "Merge a pair"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll implement the `merge` command to combine a pair of tokens into a new token.
  - slug: "ur9"
    name: "Learn merges"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll implement the `train` command to learn which pairs to merge from a text file.
  - slug: "kz6"
    name: "Encode"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll implement the `encode` command to turn new text into token ids with a list of learned merges.
  - slug: "vg5"
    name: "Decode"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll implement the `decode` command to turn token ids back into text.
  - slug: "wl7"
    name: "Split like GPT-2"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll implement the `--pretokenize gpt2` option to split text into chunks before merging, the way GPT-2 does.
  - slug: "as1"
    name: "Match GPT-2"
    difficulty: hard
    marketing_md: |-
      In this stage, you'll implement the `--vocab` option to produce GPT-2's exact token ids from its vocabulary files.
