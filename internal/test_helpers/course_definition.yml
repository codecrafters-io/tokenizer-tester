slug: "tokenizer"
name: "Build your own Tokenizer"
short_name: "Tokenizer"
release_status: "alpha"

description_md: |-
  Why do language models miscount the r's in "strawberry"? GPT-2 never sees the letters. Its tokenizer hands it `st`, `raw`, and `berry`. In this challenge, you'll build a tokenizer that splits text into the same tokens as GPT-2.

  Along the way, you'll learn about byte-pair encoding, UTF-8, and more.

short_description_md: |-
  Learn about byte-pair encoding, UTF-8, and more

completion_percentage: 5

